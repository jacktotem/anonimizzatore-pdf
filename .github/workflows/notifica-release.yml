# ============================================================
# Notifica email a ogni release pubblicata (via Resend)
#
# Manda una mail con versione, novità dal changelog della release e
# link al download. Si attiva quando una release viene pubblicata,
# oppure manualmente (utile per provare senza pubblicare nulla).
#
# CONFIGURAZIONE (una volta sola, dal proprietario del repository):
#   gh secret set RESEND_API_KEY          # chiave API Resend
#   gh variable set NOTIFY_EMAIL          # destinatario
#   gh variable set NOTIFY_FROM           # mittente (dominio verificato su Resend)
#
# L'indirizzo NON è scritto qui dentro di proposito: il repository è
# pubblico e finirebbe raccolto dagli spambot.
# ============================================================

name: Notifica release via email

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release da notificare (es. v2.0.1)"
        required: true
        type: string
      destinatario:
        description: "Invia a questo indirizzo invece che a NOTIFY_EMAIL (invio una tantum)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica configurazione
        id: cfg
        env:
          API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO: ${{ inputs.destinatario || vars.NOTIFY_EMAIL }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$TO" ]; then
            echo "::warning::Notifica email non configurata (manca RESEND_API_KEY o NOTIFY_EMAIL). Passo oltre senza fallire la release."
            echo "pronta=no" >> "$GITHUB_OUTPUT"
          else
            echo "pronta=si" >> "$GITHUB_OUTPUT"
          fi

      # Serve il codice del repository: senza checkout lo script di invio
      # non esiste nel runner (il job gira su una macchina vuota).
      - name: Checkout
        if: steps.cfg.outputs.pronta == 'si'
        uses: actions/checkout@v4

      - name: Raccogli i dati della release
        if: steps.cfg.outputs.pronta == 'si'
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" -R "$REPO" \
            --json name,body,url,publishedAt,assets > release.json
          echo "Dati raccolti per $TAG"

      - name: Componi e invia la mail
        if: steps.cfg.outputs.pronta == 'si'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # L'input ha la precedenza: consente un invio una tantum a un
          # indirizzo diverso senza toccare la configurazione permanente.
          NOTIFY_EMAIL: ${{ inputs.destinatario || vars.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: python3 .github/scripts/notifica_release.py
