# ============================================================
# Notifica email a ogni release pubblicata (via Resend)
#
# Manda una mail con versione, novità dal changelog della release e
# link al download. Si attiva quando una release viene pubblicata,
# oppure manualmente (utile per provare senza pubblicare nulla).
#
# CONFIGURAZIONE (una volta sola, dal proprietario del repository):
#   gh secret set RESEND_API_KEY          # chiave API Resend
#   gh secret set NOTIFY_EMAIL            # destinatario
#   gh secret set NOTIFY_FROM             # mittente (dominio verificato su Resend)
#
# Gli indirizzi sono SECRET, non variabili: il repository è pubblico e
# il valore di una variabile compare in chiaro nei log di Actions (nel
# blocco env dello step). Le variabili omonime sono lette solo come
# ripiego per le configurazioni esistenti: vanno migrate e cancellate.
# ============================================================

name: Notifica release via email

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release da notificare (es. v2.0.1)"
        required: true
        type: string
      destinatario:
        description: "Invia a questo indirizzo invece che a NOTIFY_EMAIL (invio una tantum)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  notifica:
    runs-on: ubuntu-latest
    # Una pre-release non va annunciata come "da installare sul server"
    if: github.event_name != 'release' || !github.event.release.prerelease
    steps:
      - name: Maschera il destinatario una tantum nei log
        # Letto dal file dell'evento e non da ${{ inputs.* }}: così il valore
        # non passa da un blocco env e non viene stampato prima della maschera.
        if: github.event_name == 'workflow_dispatch'
        run: |
          DEST=$(jq -r '.inputs.destinatario // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$DEST" ]; then echo "::add-mask::$DEST"; fi

      - name: Verifica configurazione
        id: cfg
        env:
          API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO: ${{ inputs.destinatario || secrets.NOTIFY_EMAIL || vars.NOTIFY_EMAIL }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$TO" ]; then
            echo "::warning::Notifica email non configurata (manca RESEND_API_KEY o NOTIFY_EMAIL). Passo oltre senza fallire la release."
            echo "pronta=no" >> "$GITHUB_OUTPUT"
          else
            echo "pronta=si" >> "$GITHUB_OUTPUT"
          fi

      # Serve il codice del repository: senza checkout lo script di invio
      # non esiste nel runner (il job gira su una macchina vuota).
      - name: Checkout
        if: steps.cfg.outputs.pronta == 'si'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Servono i tag delle release: la mail confronta l'elenco delle
          # librerie con la versione precedente per stimare la durata.
          fetch-depth: 0

      - name: Raccogli i dati della release
        if: steps.cfg.outputs.pronta == 'si'
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
          TAG_MANUALE: ${{ inputs.tag }}
        run: |
          TAG="${TAG_RELEASE:-$TAG_MANUALE}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag non valido: deve avere la forma v1.2.3"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # La build dell'installer parte insieme a questo workflow e
          # finisce qualche secondo dopo: senza attendere, la mail partiva
          # senza il collegamento all'exe e senza la sua impronta.
          for tentativo in $(seq 1 80); do
            if gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | grep -q '\.exe$'; then
              break
            fi
            if [ "$tentativo" -eq 80 ]; then
              echo "::error::Dopo 20 minuti l'installer non è ancora allegato: la mail non parte"
              exit 1
            fi
            sleep 15
          done
          gh release view "$TAG" -R "$REPO" \
            --json name,body,url,publishedAt,assets > release.json
          # Release pubblicata subito prima di questa (per la stima della
          # durata dell'aggiornamento): ordine di pubblicazione, no bozze.
          gh release list -R "$REPO" --limit 100 --exclude-drafts \
            --json tagName,publishedAt > releases.json
          PREV=$(TAG="$TAG" python3 -c '
          import json, os
          rel = sorted(json.load(open("releases.json")), key=lambda r: r["publishedAt"])
          tags = [r["tagName"] for r in rel]
          t = os.environ["TAG"]
          print(tags[tags.index(t) - 1] if t in tags and tags.index(t) > 0 else "")
          ')
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Dati raccolti per $TAG (versione precedente: ${PREV:-nessuna})"

      - name: Componi e invia la mail
        if: steps.cfg.outputs.pronta == 'si'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # L'input ha la precedenza: consente un invio una tantum a un
          # indirizzo diverso senza toccare la configurazione permanente.
          NOTIFY_EMAIL: ${{ inputs.destinatario || secrets.NOTIFY_EMAIL || vars.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM || vars.NOTIFY_FROM }}
          TAG: ${{ steps.rel.outputs.tag }}
          PREV_TAG: ${{ steps.rel.outputs.prev_tag }}
        run: python3 .github/scripts/notifica_release.py
