# ============================================================
# Test automatici a ogni modifica
#
# Prima di questo workflow i test giravano solo a mano: una regressione
# poteva arrivare su main, e da lì agli utenti, senza che nulla la
# fermasse (audit del 17 novembre 2026, F5).
#
# Controlla:
#   - che le tre copie di app.py siano identiche (src/ è la fonte);
#   - versione e CHANGELOG coerenti, segnaposto mai sostituiti
#     (scripts/release-checks.sh);
#   - l'intera suite, con la versione MINIMA dichiarata di PyMuPDF e con
#     l'ultima ammessa: la redazione dipende dalle funzioni di quella
#     libreria, e le due versioni si comportano diversamente.
#
# I test dell'interfaccia e dell'OCR hanno bisogno del modello italiano
# di spaCy e di Tesseract: vengono installati qui, così non si saltano.
# ============================================================

name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (PyMuPDF ${{ matrix.pymupdf }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pymupdf: [minimo, ultimo]
    env:
      QUALE_PYMUPDF: ${{ matrix.pymupdf }}
      # Stesso file e stessa impronta degli installer Windows e Mac
      MODELLO_URL: https://github.com/explosion/spacy-models/releases/download/it_core_news_lg-3.7.0/it_core_news_lg-3.7.0-py3-none-any.whl
      MODELLO_SHA256: f48bd152621c872c1f177dbe21929fbb28751e73eb3c61714cf6344c6d582bbf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Le tre copie di app.py sono identiche
        run: |
          cmp src/app.py mac/app.py
          cmp src/app.py windows/app/app.py

      - name: Controlli di rilascio (versione, changelog, segnaposto)
        run: bash scripts/release-checks.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Tesseract con la lingua italiana
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ita

      - name: Librerie
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-dev.txt
          if [ "$QUALE_PYMUPDF" = "minimo" ]; then
            MINIMA=$(grep -oE '^pymupdf>=[0-9.]+' requirements.txt | cut -d= -f2)
            echo "Versione minima dichiarata di PyMuPDF: $MINIMA"
            pip install --only-binary=:all: "pymupdf==$MINIMA"
          fi
          echo "--- versioni installate"
          pip freeze | grep -iE '^(pymupdf|pillow|streamlit|numpy|pandas|pyarrow|spacy|thinc|presidio)'

      - name: Modello italiano di spaCy (impronta verificata)
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/modello.whl" "$MODELLO_URL"
          echo "$MODELLO_SHA256  $RUNNER_TEMP/modello.whl" | sha256sum --check
          mv "$RUNNER_TEMP/modello.whl" "$RUNNER_TEMP/it_core_news_lg-3.7.0-py3-none-any.whl"
          pip install --no-deps "$RUNNER_TEMP/it_core_news_lg-3.7.0-py3-none-any.whl"

      - name: Test
        run: python -m pytest -q -rs
